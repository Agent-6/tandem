<div class="dialog-backdrop" *ngIf="isOpen" (click)="onClose()">
  <div class="dialog-content" (click)="$event.stopPropagation()">
    <div class="dialog-header">
      <h2>Share Document</h2>
      <button class="btn-icon" (click)="onClose()" title="Close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="dialog-body">
      <form class="share-form" [formGroup]="shareForm" (ngSubmit)="onShare()">
        <div class="form-group">
          <label for="share-email">Email address</label>
          <input
            id="share-email"
            type="email"
            class="input"
            formControlName="email"
            placeholder="user@example.com"
            (keyup.enter)="onShare()"
          />
          <div class="form-error" *ngIf="shareForm.get('email')?.touched && shareForm.get('email')?.invalid">
            Please enter a valid email
          </div>
        </div>
        <div class="form-group">
          <label for="share-role">Role</label>
          <select id="share-role" class="input" formControlName="role">
            <option value="Editor">Editor</option>
            <option value="Viewer">Viewer</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" [disabled]="shareForm.invalid">
          Share
        </button>
      </form>

      <div class="permissions-list" *ngIf="permissions.length > 0">
        <h3>People with access</h3>
        <div class="permission-item" *ngFor="let perm of permissions">
          <div class="user-info">
            <div class="user-avatar">
              <span class="avatar-initials">{{ perm.displayName[0].toUpperCase() }}</span>
            </div>
            <div class="user-details">
              <span class="user-email">{{ perm.displayName }}</span>
              <span class="user-role">{{ getRoleLabel(perm.role) }}</span>
            </div>
          </div>
          <div class="user-actions">
            <select
              class="input"
              [ngModel]="perm.role"
              (ngModelChange)="onUpdateRole(perm.userId, $event)"
            >
              <option value="Editor">Editor</option>
              <option value="Viewer">Viewer</option>
            </select>
            <button class="btn-icon btn-danger" (click)="onRemove(perm.userId)" title="Remove access">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
